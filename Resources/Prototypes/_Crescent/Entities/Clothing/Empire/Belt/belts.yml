- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase]
  id: ClothingBeltSheathLesothoSabre #Changed to Lesotho instead of DSM because DSM doesnt exist here
  name: sabre scabbard
  description: A scabbard meant to hold the sabre of NT High-Command.
  components:
  - type: Sprite
    sprite: _Crescent/Clothing/Empire/Belt/sabre_sheath.rsi
    state: sheath
  - type: Clothing
    sprite: _Crescent/Clothing/Empire/Belt/sabre_sheath.rsi
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: LesothoSabre
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - LesothoSabre
  - type: ItemMapper
    mapLayers:
      sheath-sabre:
        whitelist:
          tags:
          - LesothoSabre
  - type: Appearance

- type: Tag
  id: LesothoSabre

- type: entity
  id: ClothingBeltSheathLesothoSabreFilled
  parent: ClothingBeltSheathLesothoSabre
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item:
      - LesothoSabre

